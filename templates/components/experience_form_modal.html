<div id="add-experience-modal" class="project-form-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="add-exp-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="add-experience-modal" popovertargetaction="hide"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="add-experience-modal" popovertargetaction="hide">×</button>
        <h2 id="add-exp-title">Tambah Experience Baru</h2>
        <form id="experience-form" method="post" action="" class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-experience-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan</button>
            </div>
        </form>
    </div>
</div>
